# ── Konfigurasi Nginx untuk Single Page Application (SPA) ────────────
server {
    listen 80;

    root   /usr/share/nginx/html;
    index  index.html;

    # Ini baris PALING PENTING untuk SPA seperti React.
    # Kalau user buka /about atau refresh di halaman dalam, tanpa baris ini
    # Nginx cari file "/about" (tidak ada) → error 404.
    # try_files bilang: "cari file yang diminta, kalau tidak ada, balikan index.html"
    # supaya React Router yang urus routing-nya.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
