# ── Konfigurasi Nginx untuk Single Page Application (SPA) ────────────
# Catatan: file ini dipakai sebagai TEMPLATE. Saat container start, image
# nginx:alpine menjalankan envsubst yang mengganti ${PORT} dengan nilai
# environment variable PORT. Render mengirim port lewat $PORT (bukan 80),
# jadi kita tidak boleh hardcode port di sini.
server {
    listen ${PORT};

    root   /usr/share/nginx/html;
    index  index.html;

    # Ini baris PALING PENTING untuk SPA seperti React.
    # Kalau user buka /about atau refresh di halaman dalam, tanpa baris ini
    # Nginx cari file "/about" (tidak ada) → error 404.
    # try_files bilang: "cari file yang diminta, kalau tidak ada, balikan index.html"
    # supaya React Router yang urus routing-nya.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
