# Blueprint deploy Render — Web Service via Docker.
# Render build image dari Dockerfile (multi-stage: build Vite → serve Nginx),
# lalu jalankan container. Render mengirim port lewat env var $PORT; nginx.conf
# mendengarkan ${PORT} lewat template envsubst, jadi tidak ada port yang hardcode.
services:
  - type: web
    name: labspace
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
