# Deploy Vite SPA ke GitHub Pages.
# Jalan otomatis tiap push ke main: build di runner Linux (npm install pasang
# binary native Rolldown yang benar, sama seperti alasan di Dockerfile), lalu
# publish folder dist ke GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # bisa dipicu manual dari tab Actions

# Izin yang dibutuhkan actions/deploy-pages untuk publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Batalkan deploy lama kalau ada push baru sebelum yang lama selesai.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run build

      # SPA fallback: GitHub Pages tak punya try_files. Menyalin index.html
      # jadi 404.html membuat semua path tak dikenal tetap memuat app,
      # jadi refresh di route dalam tidak 404 kalau nanti pakai router.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
